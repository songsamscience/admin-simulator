<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Google 관리 콘솔 연수용 모의 체험 사이트(실제 서비스와 무관) · 제작 송쌤과학">
<title>체험용 Admin 실습 사이트 · 송쌤과학</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a73e8'/%3E%3Cpath d='M16 5.5 8.5 8.4v5.6c0 4.7 3.2 9 7.5 10.1 4.3-1.1 7.5-5.4 7.5-10.1V8.4z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='m12.6 15.2 2.4 2.4 4.4-4.6' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --fg:#1f1f1f; --fg2:#444746; --muted:#5f6368; --border:#dadce0; --line:#e0e0e0; --hover:#f1f3f4; --bg:#fff;
  --blue:#1a73e8; --blue-dk:#1967d2; --link:#0b57d0; --classic:#3367d6; --sel-bg:#e8f0fe; --card:#f0f4f9; --search:#f1f3f4;
  --red:#d93025; --red-bg:#fce8e6; --green:#188038; --green-bg:#e6f4ea; --yellow:#f9ab00; --yellow-bg:#fef7e0;
  --chip-bg:#e8eaed; --shadow:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --font:"Google Sans",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Arial,sans-serif;
  --top:64px; --navw:256px; --mpw:340px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/20px var(--font);color:var(--fg);background:#fff;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg)}
[hidden]{display:none !important}
.ic{width:20px;height:20px;fill:currentColor;flex:none;vertical-align:middle}
.ic.sm{width:16px;height:16px}
.ic.lg{width:24px;height:24px}
.muted{color:var(--muted)}
.small{font-size:12px;line-height:16px}

/* ===== 상단 바 ===== */
#topbar{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:4px;padding:0 8px;background:#fff;z-index:40}
.tb-ic{position:relative;width:40px;height:40px;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--fg2);cursor:pointer;flex:none}
.tb-ic:hover{background:var(--hover)}
.tb-ic .badge{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;font-weight:600}
#navToggle{margin-right:4px}
.brand{display:flex;align-items:center;gap:8px;color:var(--fg);min-width:0;flex:none;padding-right:8px}
.brand:hover{text-decoration:none}
.brand-mark{width:30px;height:30px;display:grid;place-items:center;flex:none}
.brand-mark svg{width:30px;height:30px}
.brand-t{font-size:19px;line-height:24px;font-weight:400;white-space:nowrap;color:#444746;letter-spacing:-.01em}
.brand-chip{font-size:11px;line-height:14px;padding:3px 8px;border-radius:10px;background:var(--sel-bg);color:#174ea6;white-space:nowrap;font-weight:500}
.brand-sim{font-size:11px;line-height:14px;padding:3px 8px;border-radius:10px;background:var(--yellow-bg);color:#8a4b00;white-space:nowrap;font-weight:500;border:1px solid #f6e2b0}
.tsearch{position:relative;flex:1;max-width:722px;height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--search);border-radius:28px;color:var(--fg2);margin-left:6px}
.tsearch:focus-within{background:#fff;box-shadow:var(--shadow)}
.tsearch input{flex:1;border:0;background:none;outline:0;height:100%;font-size:16px;min-width:0;color:var(--fg)}
.tsearch input::placeholder{color:#444746}
.tresults{position:absolute;left:0;right:0;top:52px;background:#fff;border-radius:8px;box-shadow:var(--shadow);padding:6px 0;z-index:60;color:var(--fg)}
.tresults .tr-h{font-size:12px;color:var(--muted);padding:6px 16px 4px}
.tresults .tr-i{display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.tresults .tr-i:hover,.tresults .tr-i.on{background:var(--hover)}
.tresults .tr-i small{display:block;color:var(--muted);font-size:12px}
.tresults .tr-none{padding:10px 16px;color:var(--muted)}
.tb-right{display:flex;align-items:center;gap:4px;flex:none;margin-left:auto}
#searchOpen{display:none}
.avatar{width:32px;height:32px;border-radius:50%;border:0;background:#1a73e8;color:#fff;font-size:14px;font-weight:500;cursor:pointer;margin:0 8px 0 6px;flex:none}

/* ===== 틀 ===== */
#shell{position:fixed;inset:var(--top) 0 0 0;display:flex}
#nav{width:var(--navw);flex:none;background:#fff;display:flex;flex-direction:column;z-index:30}
#navList{flex:1;overflow-y:auto;padding:8px 0 12px}
.nv{position:relative;display:flex;align-items:center;width:100%;height:40px;padding:0 12px 0 60px;border:0;background:none;border-radius:0 20px 20px 0;color:var(--fg);font-size:14px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden}
.nv:hover{background:var(--hover);text-decoration:none}
.nv .nic{position:absolute;left:26px;top:10px;color:#444746}
.nv .tri{position:absolute;left:4px;top:12px;width:16px;height:16px;color:#444746;transition:transform .12s}
.nv.exp .tri{transform:rotate(90deg)}
.nv .nv-t{flex:1;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.nv.lv2{padding-left:60px}.nv.lv2 .tri{left:40px}
.nv.lv3{padding-left:88px}.nv.lv3 .tri{left:68px}
.nv.lv4{padding-left:112px}
.nv.on{background:var(--sel-bg);color:#0b57d0;font-weight:500}
.nv.on .nic{color:#0b57d0}
.nv .nchip{font-size:11px;line-height:16px;padding:0 6px;border-radius:8px;background:#0b57d0;color:#fff;font-weight:500}
.nav-foot{flex:none;padding:10px 16px 12px;font-size:11px;line-height:16px;color:var(--muted)}
.nav-foot .fb{display:flex;align-items:center;gap:14px;height:36px;color:var(--fg2);font-size:13px;margin-left:10px}
.nav-foot .sim{display:block;margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--yellow-bg);color:#8a4b00}
#navDim{display:none}
#content{flex:1;min-width:0;overflow:auto;position:relative;background:#fff}
#safeBanner{display:flex;align-items:flex-start;gap:14px;margin:12px 24px 0;padding:12px 12px 12px 16px;background:var(--yellow-bg);border-radius:8px;color:#3c4043;font-size:13px;line-height:19px}
#safeBanner .ic{color:#e37400;margin-top:1px}
#safeBanner b{display:block;font-size:14px;color:#1f1f1f;margin-bottom:2px}
#safeBanner .x{flex:1}
#safeBanner .bb{display:flex;gap:4px;flex:none}
#safeBanner .bb button{border:0;background:none;color:var(--link);font-weight:500;font-size:13px;padding:4px 8px;border-radius:4px;cursor:pointer}
#safeBanner .bb button:hover{background:rgba(11,87,208,.08)}
.crumbbar{display:flex;align-items:center;gap:6px;height:36px;padding:0 24px;border-bottom:1px solid var(--line);font-size:12px;color:var(--fg2);flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.crumbbar a{color:var(--fg2)}
.crumbbar .sep{width:16px;height:16px;color:#5f6368}
.crumbbar b{font-weight:500;color:var(--fg)}
#main{padding:0 0 110px;container-type:inline-size;container-name:main}
.pg{padding:16px 24px 0}
h1.pt{font-size:22px;line-height:28px;font-weight:400;margin:0 0 16px}

/* ===== 미션 패널 (오른쪽, 내용 위에 떠 있음) ===== */
#mp{position:fixed;top:calc(var(--top) + 8px);right:8px;bottom:8px;width:var(--mpw);background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(60,64,67,.28);display:flex;flex-direction:column;z-index:50;overflow:hidden}
#mp.closed{display:none}
.mp-h{background:#0b57d0;color:#fff;padding:14px 10px 14px 18px}
.mp-h .row{display:flex;align-items:center;gap:8px}
.mp-h b{font-size:16px;font-weight:500;flex:1}
.mp-h .tb-ic{width:32px;height:32px;color:#fff}
.mp-h .tb-ic:hover{background:rgba(255,255,255,.16)}
.mp-h p{margin:4px 0 10px;font-size:12px;line-height:16px;opacity:.92}
.mp-bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.mp-bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .3s}
.mp-prog{font-size:12px;margin-top:6px;opacity:.95}
.mp-list{flex:1;overflow-y:auto;padding:12px}
.mp-done-all{margin:0 0 10px;padding:10px 12px;border-radius:8px;background:var(--green-bg);color:var(--green);font-size:13px;line-height:18px}
.mc{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.mc.done{border-color:#b7dfc4;background:#f6fbf7}
.mc.cur{border-color:#0b57d0;box-shadow:0 0 0 1px #0b57d0}
.mc .mc-h{display:flex;align-items:flex-start;gap:10px}
.mc .num{width:24px;height:24px;border-radius:50%;background:var(--sel-bg);color:#0b57d0;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.mc.done .num{background:var(--green);color:#fff}
.mc .mc-t{font-weight:500;font-size:14px;line-height:20px;flex:1}
.mc .mc-m{font-size:11px;color:var(--muted);white-space:nowrap;margin-top:2px}
.mc .mc-d{font-size:12px;line-height:17px;color:var(--muted);margin:6px 0 10px 34px}
.mc .mc-a{display:flex;gap:6px;margin-left:34px;align-items:center;flex-wrap:wrap}
.mc .chip-bonus{font-size:11px;padding:1px 6px;border-radius:10px;background:#fce8b2;color:#8a5a00;margin-left:6px;font-weight:500;vertical-align:1px}
.mc.locked{opacity:.6}
.mp-f{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap}
.mp-f .btn{flex:1;justify-content:center}
#mpFab{position:fixed;right:20px;bottom:20px;height:44px;padding:0 18px 0 14px;border:0;border-radius:22px;background:#0b57d0;color:#fff;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;z-index:45}
#mpFab:hover{background:#0842a0}
body.mp-open #mpFab{display:none}

/* ===== 단추·입력 ===== */
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:4px;border:1px solid transparent;background:none;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;letter-spacing:.01em}
.btn:hover{text-decoration:none}
.btn .ic{width:18px;height:18px}
.btn-filled{background:var(--blue);color:#fff}
.btn-filled:hover{background:var(--blue-dk);box-shadow:0 1px 2px rgba(60,64,67,.3)}
.btn-outlined{border-color:var(--border);color:var(--blue);background:#fff}
.btn-outlined:hover{background:#f6fafe}
.btn-text{color:var(--blue);padding:0 8px}
.btn-text:hover{background:rgba(26,115,232,.06)}
.btn-gray{color:var(--muted);padding:0 8px}
.btn-gray:hover{background:var(--hover)}
.btn[disabled],.btn.dis{pointer-events:none}
.btn-filled[disabled],.btn-filled.dis{background:#e8eaed;color:#a8abaf}
.btn-text[disabled],.btn-text.dis{color:#a8abaf}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.ic-btn{width:36px;height:36px;border:0;border-radius:50%;background:none;display:inline-grid;place-items:center;color:var(--fg2);cursor:pointer;flex:none}
.ic-btn:hover{background:var(--hover)}
.ic-btn.sm{width:30px;height:30px}
.tbtn{border:0;background:none;color:var(--blue);font-weight:500;font-size:14px;padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tbtn:hover{background:rgba(26,115,232,.06)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;min-width:0}
.fld>label,.fld>.lb{font-size:12px;line-height:16px;color:var(--muted)}
.req{color:var(--red)}
.inp{height:40px;border:1px solid #80868b;border-radius:4px;padding:0 12px;background:#fff;min-width:0;width:100%}
.inp:focus,textarea.inp:focus,select.inp:focus{outline:0;border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
textarea.inp{height:auto;min-height:120px;padding:10px 12px;resize:vertical;font-size:14px;line-height:20px;background:#f8f9fa;border-color:#dadce0}
select.inp{padding-right:28px}
.inp.err,textarea.inp.err{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.err-t{color:var(--red);font-size:12px;line-height:16px}
.help-t{color:var(--muted);font-size:12px;line-height:16px}
/* 밑줄형 입력(새 사용자 추가) */
.mf{position:relative;padding-top:18px;margin-bottom:22px;min-width:0}
.mf input{width:100%;height:30px;border:0;border-bottom:1px solid #9aa0a6;background:none;font-size:16px;padding:0 0 2px;outline:0;color:#000}
.mf input:focus{border-bottom:2px solid var(--classic);padding-bottom:1px}
.mf input.err{border-bottom:2px solid var(--red)}
.mf label{position:absolute;left:0;top:22px;font-size:16px;color:#5f6368;pointer-events:none;transition:all .12s}
.mf input:focus+label,.mf input:not(:placeholder-shown)+label{top:0;font-size:12px}
.mf input:focus+label{color:var(--classic)}
.mf .hint{display:block;font-size:12px;color:#5f6368;margin-top:6px;line-height:16px}
.mf .hint.e{color:var(--red)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.radio,.check{display:flex;align-items:flex-start;gap:12px;padding:6px 0;cursor:pointer;line-height:20px}
.radio input,.check input{width:20px;height:20px;margin:0;accent-color:var(--classic);flex:none;cursor:pointer}
.radio .sub,.check .sub{display:block;font-size:12px;color:var(--muted);line-height:16px}
.pw-box{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:4px;padding:6px 6px 6px 12px;background:#f8f9fa;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:.04em}
.pw-box span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.aid{border:1px dashed #aecbfa;background:#f8fbff;border-radius:8px;padding:10px 12px;margin:0 0 16px}
.aid-h{font-size:12px;font-weight:600;color:#174ea6;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.aid .btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ===== 카드·표 ===== */
.box{background:#fff;border:1px solid var(--border);border-radius:8px;min-width:0}
.box-h{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 12px 8px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.box-h .t{flex:1;min-width:180px;color:var(--fg2)}
.box-h .t b{font-weight:500;color:var(--fg)}
.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:18px 24px;margin-bottom:16px;min-width:0}
.card h2{font-size:16px;line-height:24px;font-weight:400;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.hcard{background:var(--card);border-radius:12px;padding:20px 24px 18px;min-width:0;break-inside:avoid;margin-bottom:24px;display:block}
.hcard .hh{display:flex;align-items:flex-start;gap:8px}
.hcard .hh div{flex:1;min-width:0}
.hcard .ht{font-size:22px;line-height:28px;color:#1f1f1f}
.hcard .hs{font-size:13px;color:#444746;margin-top:2px}
.hcard .hl{color:var(--link);font-weight:500;font-size:13px;white-space:nowrap;padding-top:4px}
.hcard .links{display:flex;flex-direction:column;gap:4px;margin-top:18px}
.hcard .links a,.hcard .links button{font-size:13px;line-height:30px;text-align:left;border:0;background:none;color:var(--link);font-weight:500;padding:0;cursor:pointer}
.hgrid{columns:3 280px;column-gap:24px;padding:20px 24px 0}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:12px;background:var(--chip-bg);font-size:12px;color:#3c4043;white-space:nowrap}
.chip.g{background:var(--green-bg);color:var(--green)}
.chip.r{background:var(--red-bg);color:var(--red)}
.chip.y{background:var(--yellow-bg);color:#b06000}
.chip.b{background:var(--sel-bg);color:#174ea6}
.st-on{color:var(--green)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;line-height:16px;font-weight:500;color:var(--fg2);text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
.tbl td{padding:0 12px;height:48px;border-bottom:1px solid var(--line);vertical-align:middle;min-width:0;color:#3c4043}
.tbl tbody tr:hover{background:#f8f9fa}
.tbl tbody tr.sel{background:var(--sel-bg)}
.tbl .cb{width:52px;padding-left:20px;padding-right:0}
.tbl .cb input{width:18px;height:18px;accent-color:var(--classic);cursor:pointer}
.tbl .ellip{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .num{text-align:right;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.ucell{display:flex;align-items:center;gap:12px;min-width:0}
.uav{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:500;flex:none}
.uav.gray{background:#e0e0e0 !important;color:#fff}
.ucell a{color:#1f1f1f;white-space:nowrap}
.ucell a:hover{color:var(--link)}
.row-acts{display:flex;gap:0;justify-content:flex-end;visibility:hidden;white-space:nowrap}
tr:hover .row-acts,tr:focus-within .row-acts,.row-acts.on,.row-acts:has(.gd-hl),.row-acts:has(.pop-anchor){visibility:visible}
@media (hover:none){.row-acts{visibility:visible}}
.row-acts .tbtn{font-size:13px;padding:6px 8px}
.c-acts{width:1%;padding:0 8px 0 0 !important;position:relative}
td.c-acts{padding:0 !important}
.tbl td.c-st,.tbl td.c-login,.tbl td.c-stor{white-space:nowrap}
/* 행 동작 단추는 실물처럼 마우스를 올린 행 오른쪽에 겹쳐 뜬다(표 너비를 차지하지 않음) */
.utbl .row-acts{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding-left:32px;background:linear-gradient(90deg,rgba(248,249,250,0),#f8f9fa 28px)}
.utbl tr.sel .row-acts{background:linear-gradient(90deg,rgba(232,240,254,0),#e8f0fe 28px)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 6px 20px;font-size:12px;color:var(--fg2);flex-wrap:wrap}
.pager .pp{display:flex;align-items:center;gap:6px}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 12px 6px 20px;background:var(--sel-bg);color:#174ea6;font-weight:500;border-bottom:1px solid var(--line)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px 0 10px;border:1px solid var(--border);border-radius:16px;background:#fff;font-size:13px;cursor:pointer;color:var(--fg2)}
.fchip:hover{background:var(--hover)}
.fchip.on{background:var(--sel-bg);border-color:transparent;color:#174ea6}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line)}
.frow .q{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.frow .q input{border:0;outline:0;flex:1;height:32px;background:none;min-width:0}
.two{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;align-items:start;padding:16px 24px 0}
.two.closed{grid-template-columns:44px minmax(0,1fr)}
@container main (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}.two>.lp{display:none}.two .lp-chip{display:inline-flex !important}}
.lp-chip{display:none !important}
/* 왼쪽 선택 패널 */
.lp{background:#fff;border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden}
.lp-top{display:flex;align-items:center;gap:8px;padding:14px 10px 10px 16px}
.lp-top .tt{flex:1;font-size:13px;color:var(--fg2)}
.lp-title{display:flex;align-items:center;gap:14px;padding:22px 16px 18px;border-bottom:1px solid var(--line)}
.lp-title b{font-size:22px;line-height:28px;font-weight:400}
.lp-sec{border-bottom:1px solid var(--line)}
.lp-sec>button{display:flex;align-items:center;width:100%;height:44px;padding:0 12px 0 16px;border:0;background:none;color:var(--fg2);font-size:13px;cursor:pointer}
.lp-sec>button span{flex:1;text-align:left}
.lp-sec>button .ic{transition:transform .15s}
.lp-sec.open>button .ic{transform:rotate(180deg)}
.lp-search{margin:2px 16px 8px;border:0;border-bottom:1px solid #9aa0a6;height:30px;width:calc(100% - 32px);outline:0;font-size:13px;background:none}
.lp-search:focus{border-bottom:2px solid var(--classic)}
.lp-item{display:block;width:calc(100% - 16px);margin:0 8px 8px;padding:10px 12px;border:0;border-radius:4px;background:#f1f3f4;text-align:left;cursor:pointer;font-size:13px}
.lp-item.on{background:#e8eaed;font-weight:500}
.lp-foot{display:block;text-align:center;padding:14px;border-top:1px solid var(--line);color:var(--link);font-weight:500;font-size:13px}
.lp-scroll{max-height:360px;overflow-y:auto;padding-bottom:8px}
.seg{display:flex;margin:4px 16px 10px;border:1px solid #747775;border-radius:18px;overflow:hidden}
.seg button{flex:1;height:32px;border:0;background:#fff;font-size:13px;cursor:pointer;color:var(--fg2)}
.seg button+button{border-left:1px solid #747775}
.seg button.on{background:#c2e7ff;color:#001d35}
.lp-radio{padding:0 16px 6px}
.lp-radio .radio{font-size:13px;padding:4px 0}
.lp-radio .radio input{width:18px;height:18px}
.lp-min{position:absolute;right:8px;top:10px}
.tree{list-style:none;margin:0;padding:0}
.tree .tn{display:flex;align-items:center;gap:6px;width:100%;min-height:32px;border:0;background:none;padding:0 12px;text-align:left;cursor:pointer;font-size:13px;color:#3c4043}
.tree .tn:hover{background:var(--hover)}
.tree .tn.on{background:#e8eaed;color:#1f1f1f;font-weight:500}
.tree .tn .tw{width:16px;height:16px;color:#5f6368;flex:none}
.tree .tn .cnt{color:var(--muted);font-size:12px;margin-left:auto;font-weight:400}
.tree .tn input{width:18px;height:18px;accent-color:var(--classic);margin:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:1;height:48px;padding:0 16px;border:0;background:none;font-weight:500;color:var(--fg2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
.tab:hover{background:var(--hover)}
.tab.on{color:var(--classic);border-bottom-color:var(--classic)}
.tabs.left .tab{flex:none}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:8px;background:var(--sel-bg);color:#174ea6;font-size:13px;line-height:19px;margin-bottom:16px}
.note.y{background:var(--yellow-bg);color:#8a4b00}
.note.g{background:var(--green-bg);color:#0d652d}
.mock-band{font-size:12px;line-height:16px;color:#8a4b00;background:var(--yellow-bg);border-radius:8px;padding:8px 12px;margin:16px 24px 0}
.bar{height:8px;border-radius:4px;background:#e8eaed;display:flex;overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--fg2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--c);vertical-align:1px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.apptile{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));padding:16px 24px 0}
.grid>.card{margin:0}
.ovcard{border:1px solid var(--border);border-radius:8px;padding:18px 20px;min-height:140px;display:flex;flex-direction:column;gap:6px;background:#fff;cursor:pointer;text-align:left}
.ovcard:hover{box-shadow:var(--shadow)}
.ovcard b{font-size:16px;font-weight:400}
.ovcard span{font-size:13px;color:var(--muted)}

/* Chrome 설정 표 */
.ctool{display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}
.ctool .q{flex:1;min-width:200px;display:flex;align-items:center;gap:6px;height:32px;border:1px solid var(--border);border-radius:16px;padding:0 12px;color:var(--fg2)}
.ctool .q input{border:0;outline:0;flex:1;min-width:0;font-size:13px;background:none}
.csec{display:flex;align-items:center;gap:10px;padding:14px 20px 6px;font-size:14px;color:var(--fg)}
.csec i{width:20px;height:20px;border-radius:4px;background:#f9ab00;display:grid;place-items:center;color:#fff;font-style:normal;flex:none}
.ctbl{width:calc(100% - 40px);margin:0 20px 6px;border-collapse:collapse;font-size:13px}
.ctbl th{font-weight:500;font-size:12px;color:var(--fg);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.ctbl td{padding:0 8px;height:44px;border-bottom:1px solid var(--line);color:#3c4043}
.ctbl tr.cr{cursor:pointer}
.ctbl tr.cr:hover td{background:#f8f9fa}
.ctbl .loc{color:#0b57d0;font-weight:500}
.plat{display:flex;gap:6px;color:#5f6368;font-size:10px;align-items:center}
.plat i{display:inline-block;width:14px;height:10px;border:1.5px solid #5f6368;border-radius:2px}
.plat i.c{width:12px;height:12px;border-radius:50%}
/* 설정 상세 */
.sdet{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.sinfo{display:grid;grid-template-columns:1fr 240px;gap:24px;padding:18px 20px;border-bottom:1px solid var(--line)}
.sinfo h3{font-size:14px;font-weight:500;margin:0 0 8px}
.sinfo p{margin:0 0 8px;font-size:13px;line-height:19px;color:#3c4043}
.sinfo .rel{background:#f8f9fa;border-radius:8px;padding:10px 12px;font-size:12px;line-height:17px}
.sinfo .rel a{display:block;font-weight:500;margin-bottom:2px}
@container main (max-width:900px){.sinfo{grid-template-columns:1fr}}
.srow{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);background:#fafafa}
.srow.w{background:#fff}
.srow .k{font-size:13px;color:var(--fg)}
.srow .v{font-size:13px;color:#3c4043;min-width:0}
.srow .sub-t{font-size:13px;font-weight:500;margin:0 0 6px}
.sbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:12px 20px;background:#fff;border-top:1px solid var(--line);z-index:5}
.sbar .t{flex:1;color:var(--fg2);font-size:13px}
/* 관리 설정 행(저장용량) */
.mrows .mr{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding:20px 24px;border-top:1px solid var(--line);cursor:pointer}
.mrows .mr:hover{background:#f8f9fa}
.mrows .mr.ed{cursor:default;background:#fff;box-shadow:inset 3px 0 0 var(--classic)}
.mrows .mr .k b{display:block;font-weight:500;font-size:14px}
.mrows .mr .k span{font-size:12px;color:var(--muted)}
.mrows .mr .v{font-size:13px;color:#3c4043;line-height:19px}
.mrows .mr .v .now{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.mrows .act{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.ffield{position:relative;background:#f1f3f4;border-radius:4px 4px 0 0;border-bottom:1px solid #5f6368;padding:18px 12px 4px;min-width:140px}
.ffield label{position:absolute;left:12px;top:6px;font-size:11px;color:var(--fg2)}
.ffield input,.ffield select{border:0;background:none;outline:0;width:100%;font-size:15px;height:24px}
.ffield:focus-within{border-bottom:2px solid var(--classic)}
.ffield.err{border-bottom:2px solid var(--red)}
.infos{margin-top:14px;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--fg2)}
.infos div{display:flex;gap:8px;align-items:flex-start}
.infos .ic{color:#1a73e8;width:18px;height:18px}
/* 사용자 상세 */
.ud{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:16px 24px 0;align-items:start}
@container main (max-width:820px){.ud{grid-template-columns:1fr}}
.ud-left .uh{padding:20px 16px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line)}
.ud-left .uh b{display:block;font-size:22px;line-height:28px;font-weight:400}
.ud-left .uh small{display:block;font-size:12px;color:var(--muted);line-height:17px}
.ud-left .uou{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.ud-left .uou div{color:#1f1f1f;font-size:13px;margin-top:4px}
.ud-left .uacts button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 16px;font-size:13px;color:#3c4043;cursor:pointer}
.ud-left .uacts button:hover{background:var(--hover)}
.ud-right .alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:8px;margin:12px 0;font-size:13px}
.coll{border:1px solid var(--border);border-radius:8px;margin-bottom:12px;background:#fff;overflow:hidden}
.coll>.ch{display:flex;align-items:center;padding:16px 20px;font-size:16px;color:var(--fg2);cursor:pointer}
.coll>.ch span{flex:1}
.coll .cb2{padding:4px 20px 18px;font-size:13px}

/* ===== 대화상자 ===== */
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:100;padding:16px}
.dlg{background:#fff;border-radius:2px;box-shadow:0 12px 32px rgba(0,0,0,.3);width:520px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.dlg.m3{border-radius:8px}
.dlg.w720{width:720px}
.dlg.w960{width:960px}
.dlg-h{display:flex;align-items:flex-start;gap:12px;padding:20px 16px 18px 24px;background:var(--classic);color:#fff}
.dlg-h h2{font-size:20px;line-height:26px;font-weight:400;margin:0;flex:1;min-width:0;white-space:pre-line}
.dlg-h .ic-btn{color:#fff;margin-top:-6px}
.dlg-h .ic-btn:hover{background:rgba(255,255,255,.15)}
.dlg.m3 .dlg-h{background:#fff;color:var(--fg);padding:24px 16px 8px 24px}
.dlg.m3 .dlg-h h2{font-size:22px;line-height:28px}
.dlg.m3 .dlg-h .ic-btn{color:var(--fg2)}
.dlg-b{padding:20px 24px 16px;overflow-y:auto;flex:1;min-height:0}
.dlg-f{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 16px 12px 24px;border-top:1px solid var(--line)}
.dlg.m3 .dlg-f{border-top:0;padding:8px 16px 18px 24px}
.dlg-f .sp{flex:1}
.dlg p{margin:0 0 12px;line-height:21px}
/* 단계식(일괄 업데이트) */
.vsteps{position:relative}
.vstep{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-bottom:22px;position:relative}
.vstep::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:#dadce0}
.vstep:last-child::before{display:none}
.vstep .n{width:24px;height:24px;border-radius:50%;background:var(--classic);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:500}
.vstep .st{font-weight:500;margin:2px 0 10px}
.extbl{border-collapse:collapse;font-size:12px;margin:8px 0}
.extbl td,.extbl th{border:1px solid #dadce0;padding:4px 10px;text-align:left}
.extbl th{background:#f1f3f4;font-weight:400;color:var(--muted);text-align:center}
/* 전체 화면 페이지(새 사용자 추가) */
.fp{position:fixed;inset:0;background:#fff;z-index:95;display:flex;flex-direction:column}
.fp-h{height:72px;flex:none;display:flex;align-items:center;gap:20px;padding:0 24px 0 16px;background:var(--classic);color:#fff;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15)}
.fp-h .ic-btn{color:#fff}
.fp-h .ic-btn:hover{background:rgba(255,255,255,.15)}
.fp-h h2{flex:1;font-size:20px;font-weight:400;margin:0}
.fp-h .hp{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.95}
.fp-b{flex:1;overflow-y:auto;padding:20px 16px 60px}
.fp-card{max-width:1024px;margin:0 auto;border-radius:2px;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);background:#fff}
.fp-card .fh{height:48px;display:flex;align-items:center;padding:0 24px;background:#f8f9fa;border-bottom:1px solid var(--line);color:#5f6368;font-size:15px}
.fp-card .fb{padding:24px 24px 8px}
.fp-card .fsec{border-top:1px solid var(--line);padding:20px 24px}
.fp-foot{max-width:1024px;margin:16px auto 0;display:flex;justify-content:flex-end;gap:8px}
.explink{border:0;background:none;color:var(--classic);font-weight:500;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-size:14px}
.ouline{display:flex;align-items:center;gap:8px;border-bottom:1px solid #9aa0a6;padding:4px 0;max-width:472px}
.ouline b{flex:1;font-weight:400;font-size:15px}
.photo{display:flex;align-items:center;gap:20px;margin:22px 0 6px}
.photo i{width:72px;height:72px;border-radius:50%;background:#f1f3f4;display:grid;place-items:center;color:#1a73e8;font-style:normal}
/* 마켓플레이스(새 탭처럼) */
.mkp{position:fixed;inset:0;background:#fff;z-index:96;display:flex;flex-direction:column}
.mkp-tab{height:34px;flex:none;background:#dee1e6;display:flex;align-items:flex-end;padding:0 10px;gap:6px;font-size:12px}
.mkp-tab span{background:#fff;border-radius:8px 8px 0 0;padding:7px 14px;display:flex;align-items:center;gap:8px;max-width:320px}
.mkp-tab .ic-btn{width:24px;height:24px;margin-bottom:5px}
.mkp-h{height:64px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line)}
.mkp-h .lg{display:flex;align-items:center;gap:8px;font-size:18px;color:#5f6368;white-space:nowrap}
.mkp-h .lg i{width:28px;height:28px;border-radius:50%;background:#1a73e8;display:grid;place-items:center;font-style:normal;color:#fff;font-size:13px}
.mk-search{flex:1;max-width:640px;display:flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:23px;background:#f1f3f4;color:var(--muted)}
.mk-search input{border:0;outline:0;background:none;flex:1;height:100%;font-size:15px;min-width:0}
.mkp-b{flex:1;overflow-y:auto;padding:24px 32px 60px}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.mk-card{border:1px solid var(--border);border-radius:8px;padding:16px;cursor:pointer;background:#fff;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:160px}
.mk-card:hover{box-shadow:var(--shadow);border-color:transparent}
.mk-card .h{display:flex;gap:10px;align-items:center}
.mk-card b{font-weight:500}
.mk-card small{color:var(--muted);font-size:12px;line-height:16px}
.mk-card .rt{font-size:12px;color:var(--muted);margin-top:auto}
.perm{list-style:none;padding:0;margin:0 0 12px;border:1px solid var(--border);border-radius:8px}
.perm li{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid #ebedef;font-size:13px;line-height:18px}
.perm li:last-child{border-bottom:0}
.done-mark{width:56px;height:56px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;margin:8px auto 12px}
.done-mark .ic{width:32px;height:32px}
.pop{position:fixed;background:#fff;border-radius:4px;box-shadow:var(--shadow);padding:8px 0;min-width:200px;max-width:min(360px,calc(100vw - 16px));z-index:105;max-height:70vh;overflow-y:auto}
.pop .mi{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 20px;border:0;background:none;text-align:left;cursor:pointer;font-size:14px;color:var(--fg)}
.pop .mi:hover{background:var(--hover)}
.pop .mi .ic{color:var(--muted);width:18px;height:18px}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.pop .ph2{padding:8px 16px;font-size:12px;color:var(--muted)}
.pop .nt{padding:10px 16px;border-bottom:1px solid #ebedef;font-size:13px;line-height:18px}
.pop .nt:last-child{border-bottom:0}
.pop .nt small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.launch{display:grid;grid-template-columns:repeat(3,88px);gap:4px;padding:12px}
.launch button{border:0;background:none;border-radius:8px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--fg)}
.launch button:hover{background:var(--hover)}
.launch i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700}
#toast{position:fixed;left:24px;bottom:24px;z-index:120;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.snack{background:#323232;color:#fff;border-radius:4px;padding:14px 16px;min-width:280px;max-width:min(560px,calc(100vw - 48px));font-size:14px;line-height:20px;box-shadow:var(--shadow);animation:snk .2s ease-out}
@keyframes snk{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* 작업 서랍 */
#tasksDrawer{position:fixed;top:var(--top);right:0;bottom:0;width:400px;max-width:100vw;background:#fff;box-shadow:var(--shadow);z-index:90;display:flex;flex-direction:column}
.td-h{display:flex;align-items:center;gap:8px;padding:14px 12px 10px 20px;border-bottom:1px solid var(--border)}
.td-h b{font-size:16px;font-weight:500;flex:1}
.td-b{flex:1;overflow-y:auto;padding:12px 16px}
.task{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.task .tt{display:flex;align-items:center;gap:8px;font-weight:500}
.task .tm{font-size:12px;color:var(--muted);margin:2px 0 8px}
.task .pg2{height:4px;background:var(--chip-bg);border-radius:2px;overflow:hidden;margin:8px 0}
.task .pg2 i{display:block;height:100%;background:var(--blue);width:37%;animation:tp 1.5s linear forwards}
@keyframes tp{from{width:12%}to{width:92%}}
.task .sumr{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}

/* CSV 미리보기 */
.csv-sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.csv-prev{max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:4px}
.csv-prev .tbl td{height:34px;font-size:12px}
.csv-prev .tbl th{padding:8px 12px}
.csv-prev tr.bad td{background:var(--red-bg)}
.csv-prev .msg{color:var(--red);font-size:12px}
.csv-prev .ok{color:var(--green);font-size:12px}
.file-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#f8f9fa;border-radius:4px;margin:10px 0;font-size:13px}

/* ===== 코치 ===== */
.gd-hl{outline:3px solid #fbbc04 !important;outline-offset:2px;animation:gdPulse 1.2s ease-in-out infinite;border-radius:6px}
@keyframes gdPulse{0%,100%{box-shadow:0 0 0 2px rgba(251,188,4,.55)}50%{box-shadow:0 0 0 9px rgba(251,188,4,0)}}
#guideBar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(600px,calc(100vw - 32px));background:#202124;color:#fff;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:110;padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:flex-start}
#guideBar.top{bottom:auto;top:76px}
.gb-n{flex:none;font-size:11px;line-height:14px;background:#fbbc04;color:#202124;border-radius:10px;padding:3px 8px;font-weight:700;margin-top:2px;white-space:nowrap}
.gb-x{flex:1;min-width:0}
.gb-m{font-size:11px;color:#bdc1c6;margin-bottom:2px}
.gb-t{font-weight:500;font-size:15px;line-height:20px}
.gb-d{font-size:12.5px;line-height:18px;color:#dadce0;margin-top:3px}
.gb-f{font-size:12.5px;line-height:18px;color:#f28b82;margin-top:4px;font-weight:500}
.gb-b{display:flex;flex-direction:column;gap:4px;flex:none}
.gb-b button{height:26px;padding:0 10px;border-radius:4px;border:1px solid #5f6368;background:none;color:#e8eaed;font-size:12px;cursor:pointer;white-space:nowrap}
.gb-b button:hover{background:#3c4043}
.gb-b button[disabled]{opacity:.35;pointer-events:none}

/* ===== 반응형 ===== */
body.nav-mini #nav{width:72px}
body.nav-mini .nv{padding-left:0;justify-content:center}
body.nav-mini .nv .nv-t,body.nav-mini .nv .tri,body.nav-mini .nav-foot,body.nav-mini .nv.lv2,body.nav-mini .nv.lv3,body.nav-mini .nv.lv4{display:none}
body.nav-mini .nv .nic{position:static}
@media (max-width:1100px){
  .brand-chip,.brand-sim{display:none}
}
@media (max-width:1023px){
  #nav{position:fixed;top:var(--top);left:0;bottom:0;transform:translateX(-100%);transition:transform .2s}
  body.nav-open #nav{transform:none;box-shadow:var(--shadow)}
  body.nav-open #navDim{display:block;position:fixed;inset:var(--top) 0 0 0;background:rgba(0,0,0,.32);z-index:25}
  body.nav-mini #nav{width:var(--navw)}
  #mp{top:auto;left:8px;right:8px;width:auto;height:62vh}
}
@media (max-width:760px){
  .tsearch{display:none}
  .tsearch.open{display:flex;position:fixed;left:8px;right:8px;top:8px;z-index:70;background:#fff;box-shadow:var(--shadow);margin:0}
  #searchOpen{display:grid}
  .brand-t{font-size:15px}
  #topbar [data-act="launcher"],#topbar [data-act="notif"]{display:none}
  .mrow{grid-template-columns:1fr}
  .mrows .mr{grid-template-columns:1fr;gap:8px}
  .srow{grid-template-columns:1fr;gap:6px}
}
@media (max-width:599px){
  .pg,.two,.ud,.grid,.hgrid{padding-left:12px;padding-right:12px}
  #safeBanner{margin:8px 12px 0}
  .brand-t{font-size:13px;white-space:normal;line-height:16px;max-width:120px}
  .brand-mark,.brand-mark svg{width:26px;height:26px}
  .dlg-bg{padding:0}
  .dlg,.dlg.w720,.dlg.w960{width:100vw;max-width:100vw;height:100%;max-height:100vh;border-radius:0}
  .tbl.utbl thead{display:none}
  .tbl.utbl tr{display:grid;grid-template-columns:44px 1fr auto;grid-template-areas:"cb nm act" "cb em act" "cb st act";padding:8px 4px;border-bottom:1px solid var(--line)}
  .tbl.utbl td{height:auto;border:0;padding:2px 4px}
  .tbl.utbl td.cb{grid-area:cb;padding-left:8px}
  .tbl.utbl td.c-name{grid-area:nm}
  .tbl.utbl td.c-email{grid-area:em;font-size:12px;color:var(--muted)}
  .tbl.utbl td.c-st{grid-area:st}
  .tbl.utbl td.c-acts{grid-area:act;align-self:center;position:static}
  .utbl .row-acts{position:static;transform:none;background:none;padding-left:0}
  .tbl.utbl td.c-login,.tbl.utbl td.c-stor{display:none}
  .row-acts .ra-x{display:none}
  #guideBar{width:calc(100vw - 16px);bottom:8px;padding:10px}
  #mpFab{right:12px;bottom:12px}
  #toast{left:8px;right:8px;bottom:12px}
  .snack{min-width:0}
  #tasksDrawer{width:100vw}
  .fp-h{height:60px}
  .fp-b{padding:12px 8px 60px}
  .mkp-b{padding:16px}
  .mkp-h .lg span{display:none}
}
@container main (max-width:900px){.c-login{display:none}}
@container main (max-width:700px){.c-stor{display:none}}
@media print{#topbar,#nav,#mp,#mpFab,#guideBar{display:none}}
.mpg>.card,.mpg>.note,.mpg>p{margin:16px 24px}
@media (max-width:599px){.mpg>.card,.mpg>.note,.mpg>p{margin:12px}}

.ougrid{display:grid;grid-template-columns:minmax(220px,320px) minmax(0,1fr)}
.ougrid-l{border-right:1px solid var(--line);padding:8px 0}
@container main (max-width:700px){.ougrid{grid-template-columns:minmax(0,1fr)}.ougrid-l{border-right:0;border-bottom:1px solid var(--line)}}

<script>
(function () {
'use strict';
/* ============ 기본 도구 ============ */
const KEY = 'ssam_gadmin_sim_v2';
const DOMAIN = 'dtutor.example';
const SCHOOL = '디지털튜터학교';
const ADMIN = 'admin@' + DOMAIN;
const GUIDE_PDF = 'https://songsamscience.github.io/admin-simulator/guide.pdf';  /* 실습 방법 안내 PDF(게시본) */
const DAY = 86400000;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const now = () => Date.now();
const pad = (n, w = 2) => String(n).padStart(w, '0');
function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`; }
function fmtTime(ts) { const d = new Date(ts); let h = d.getHours(); const ap = h < 12 ? '오전' : '오후'; h = h % 12 || 12; return `${ap} ${h}:${pad(d.getMinutes())}`; }
function fmtDT(ts) { return fmtDate(ts) + ' ' + fmtTime(ts); }
function ymd(ts = now()) { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function relLogin(ts) {
  if (!ts) return '로그인한 적 없음';
  const d = Math.floor((now() - ts) / DAY);
  if (d <= 0) return '오늘';
  if (d === 1) return '어제';
  return d + '일 전';
}
function fmtGB(mb) {
  if (mb >= 1024 * 1024) return (mb / 1024 / 1024).toFixed(2) + ' TB';
  return (mb / 1024).toFixed(2) + ' GB';
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const AV_COLORS = ['#1a73e8', '#e8710a', '#188038', '#9334e6', '#d01884', '#129eaf', '#b06000', '#5f6368', '#c5221f', '#185abc'];
function avColor(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return AV_COLORS[Math.abs(h) % AV_COLORS.length]; }
function uName(u) { return u.last + u.first; }
function uAv(u, size = 32) {
  return `<span class="uav" style="background:${avColor(u.email)};width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px">${esc(u.last || u.first || '?')}</span>`;
}

/* ============ 처음 상태(시드) ============ */
const OU_SEED = [
  ['ou_root', SCHOOL, null, '최상위 조직 단위'],
  ['ou_staff', '교직원', 'ou_root', '교사와 행정 직원'],
  ['ou_teach', '교사', 'ou_staff', '담임·교과 교사'],
  ['ou_office', '행정실', 'ou_staff', '행정 직원'],
  ['ou_stu', '학생', 'ou_root', '재학생 전체'],
  ['ou_g1', '1학년', 'ou_stu', ''],
  ['ou_g2', '2학년', 'ou_stu', ''],
  ['ou_g3', '3학년', 'ou_stu', ''],
  ['ou_alum', '졸업생', 'ou_root', '졸업 후 계정 보관']
];
const TEACH_SEED = [
  ['admin', '송', '관리', 'T000', '정보부(최고 관리자)', 8400, 'admin'],
  ['t101', '홍', '정보', 'T101', '정보부', 15200], ['t102', '김', '수현', 'T102', '과학', 9800],
  ['t103', '이', '민재', 'T103', '국어', 4300], ['t104', '박', '서윤', 'T104', '영어', 7600],
  ['t105', '최', '도윤', 'T105', '수학', 3100], ['t106', '정', '하린', 'T106', '사회', 5400],
  ['t107', '강', '예준', 'T107', '체육', 2200], ['t108', '조', '지우', 'T108', '음악', 6100],
  ['t109', '윤', '시아', 'T109', '미술', 11900], ['t110', '장', '유진', 'T110', '기술·가정', 2800],
  ['t111', '임', '현서', 'T111', '도덕', 1900], ['t112', '한', '은빈', 'T112', '과학(2026.8 전출 예정)', 22400]
];
const STU_SEED = {
  ou_g1: 's10101 신채원,s10103 권태윤,s10105 황다은,s10107 안건우,s10109 송소율,s10112 전민서,s10201 홍지호,s10204 김하연,s10206 이수빈,s10208 박시현,s10211 최준혁,s10215 정윤아',
  ou_g2: 's20102 강예린,s20105 조은서,s20107 윤재우,s20110 장서준,s20113 임도현,s20116 한아율,s20201 오민결,s20203 서유람,s20209 신지솔,s20214 권하담,s20218 황수호',
  ou_g3: 's30101 안예빈,s30104 송현우,s30106 전소연,s30108 홍다인,s30111 김건호,s30114 이시윤,s30202 박태영,s30205 최지안,s30207 정수아,s30210 강도영,s30213 조민혁'
};
function mkUser(o) {
  return Object.assign({
    id: 'u_' + o.local, first: '', last: '', email: o.local + '@' + DOMAIN, ou: 'ou_root', role: 'student',
    status: 'active', deletedAt: null, transfer: null, lastLogin: null, storageUsedMB: 0, mailUsedMB: 0,
    pwd: { mustChange: false, lastReset: null, value: null }, recoveryEmail: '', phone: '',
    employeeId: '', department: '', createdAt: now(), createdBy: 'manual'
  }, o);
}
function seed() {
  const R = mulberry32(20261031), t = now();
  const ous = OU_SEED.map(([id, name, parent, desc]) => ({ id, name, parent, desc }));
  const users = [];
  const login = () => t - Math.floor(R() * 20) * DAY - Math.floor(R() * 10) * 3600000;
  for (const [local, last, first, emp, dept, mb, role] of TEACH_SEED) {
    users.push(mkUser({ local, last, first, ou: 'ou_teach', role: role || 'teacher', employeeId: emp, department: dept,
      storageUsedMB: mb, mailUsedMB: Math.round(mb * .28), lastLogin: login(), createdAt: t - 400 * DAY, createdBy: 'seed' }));
  }
  users.push(mkUser({ local: 'a201', last: '오', first: '재원', ou: 'ou_office', role: 'staff', employeeId: 'A201', department: '행정실', storageUsedMB: 1200, mailUsedMB: 410, lastLogin: login(), createdAt: t - 380 * DAY, createdBy: 'seed' }));
  users.push(mkUser({ local: 'a202', last: '서', first: '아린', ou: 'ou_office', role: 'staff', employeeId: 'A202', department: '행정실', storageUsedMB: 900, mailUsedMB: 300, lastLogin: login(), createdAt: t - 380 * DAY, createdBy: 'seed' }));
  for (const ou of Object.keys(STU_SEED)) {
    for (const item of STU_SEED[ou].split(',')) {
      const [local, nm] = item.split(' ');
      const num = local.slice(1), g = num[0], ban = +num.slice(1, 3);
      const mb = 200 + Math.floor(R() * 2400);
      users.push(mkUser({ local, last: nm[0], first: nm.slice(1), ou, role: 'student', employeeId: num,
        department: `${g}학년 ${ban}반`, storageUsedMB: mb, mailUsedMB: Math.round(mb * .04), lastLogin: login(), createdAt: t - 240 * DAY, createdBy: 'seed' }));
    }
  }
  const teachers = users.filter(u => u.ou === 'ou_teach').map(u => u.id);
  return {
    ver: 2, school: SCHOOL, domain: DOMAIN,
    ous, users,
    groups: [
      { id: 'g_teachers', name: '전체교사', email: 'teachers@' + DOMAIN, desc: '교사 전체 공지용', members: teachers },
      { id: 'g_g1', name: '1학년학생', email: 'grade1-students@' + DOMAIN, desc: '1학년 학생 전체', members: users.filter(u => u.ou === 'ou_g1').map(u => u.id) },
      { id: 'g_it', name: '정보부', email: 'it-team@' + DOMAIN, desc: '정보부 업무', members: ['u_admin', 'u_t101'] }
    ],
    apps: { marketplace: [
      { id: 'kami', name: 'Kami', vendor: 'Kami Limited', installed: true, scope: { type: 'all', targets: [] }, enabled: true, installedAt: new Date('2026-03-02T09:00:00').getTime() }
    ] },
    chrome: { byOu: {} },
    storage: { poolTB: 100, used: { driveTB: 1.61, gmailTB: 0.58, photosTB: 0.18 }, byOu: {}, byGroup: {}, byUser: {} },
    tasks: [], audit: [],
    mission: { done: {} },
    flags: {},
    ui: { navExp: ['dir'], mpOpen: true, chromeOu: 'ou_root', storageOu: 'ou_root', storageKind: 'ou', usersOu: null, usersQ: '', usersStatus: '', usersPage: 0, usersPer: 50, lastCsv: null, mkTab: 'installed', chromeTab: 'users' }
  };
}

/* ============ 상태 저장 ============ */
let S;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.ver === 2 && Array.isArray(o.users)) { S = o; return; } }
  } catch (e) { /* 저장소가 막혀 있으면 새로 시작 */ }
  S = seed();
}
function save() {
  if (S.audit.length > 300) S.audit.length = 300;
  if (S.tasks.length > 20) S.tasks.length = 20;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 개인 창 등 */ }
  if (typeof checkMissions === 'function') checkMissions();
}
function resetAll() {
  if (typeof coachStop === 'function') coachStop(true);
  S = seed(); save();
  try { sessionStorage.removeItem('gadmin_banner_off'); } catch (e) {}
  location.hash = '#/home';
  location.reload();
}
window.addEventListener('beforeunload', () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} });

function audit(event, target, desc) {
  S.audit.unshift({ t: now(), actor: ADMIN, event, target: target || '', desc: desc || '' });
}
const AUDIT_NAME = {
  user_create: '사용자 생성', user_delete: '사용자 삭제', user_restore: '사용자 복원', pw_reset: '비밀번호 재설정',
  user_rename: '사용자 이름 변경', ou_move: '조직 단위 변경', bulk_upload: '사용자 일괄 업로드', chrome_set: 'Chrome 설정 변경',
  app_install: '앱 설치', app_change: '앱 설정 변경', app_remove: '앱 삭제', storage_limit: '저장용량 한도 변경',
  ou_create: '조직 단위 생성', ou_rename: '조직 단위 이름 변경', ou_delete: '조직 단위 삭제', user_suspend: '사용자 정지', user_unsuspend: '사용자 다시 활성화'
};

/* ============ 조직 단위 도우미 ============ */
const ouById = id => S.ous.find(o => o.id === id);
function ouPath(id) {
  const o = ouById(id); if (!o) return '?';
  if (!o.parent) return '/';
  const p = ouPath(o.parent);
  return (p === '/' ? '' : p) + '/' + o.name;
}
function ouByPath(p) {
  p = String(p || '').trim();
  if (p === '/') return S.ous.find(o => !o.parent);
  if (p.length > 1 && p.endsWith('/')) p = p.slice(0, -1);
  return S.ous.find(o => o.parent && ouPath(o.id) === p);
}
function ouChain(id) { const out = []; let o = ouById(id); while (o) { out.push(o.id); o = o.parent ? ouById(o.parent) : null; } return out; }
function ouKids(id) { return S.ous.filter(o => o.parent === id); }
function ouDesc(id) { const out = [id]; for (const k of ouKids(id)) out.push(...ouDesc(k.id)); return out; }
function ouLabel(id) { const o = ouById(id); return o ? o.name : '?'; }
function roleForOu(ou) {
  const ch = ouChain(ou);
  if (ch.includes('ou_stu')) return 'student';
  if (ch.includes('ou_office')) return 'staff';
  if (ch.includes('ou_staff')) return 'teacher';
  return 'student';
}
const userById = id => S.users.find(u => u.id === id);
const userByEmail = e => S.users.find(u => u.email.toLowerCase() === String(e).toLowerCase());

let topSel = -1;
function topSearchResults(q) {
  q = q.trim().toLowerCase();
  if (!q) return null;
  const us = activeUsers().filter(u => (uName(u) + ' ' + u.email + ' ' + u.employeeId).toLowerCase().includes(q)).slice(0, 6);
  const gs = S.groups.filter(g => (g.name + ' ' + g.email).toLowerCase().includes(q)).slice(0, 3);
  const SET = [
    { t: 'URL 차단', d: '기기 › Chrome › 설정 › 콘텐츠', k: 'chrome-settings', w: 'url 차단 유해 사이트 url차단 block' },
    { t: '세이프서치 및 제한 모드', d: '기기 › Chrome › 설정 › 콘텐츠', k: 'chrome-settings', w: '세이프서치 safesearch youtube 유튜브 제한 모드' },
    { t: '저장용량 한도', d: '저장용량 › 저장용량 설정', k: 'storage-settings', w: '저장용량 한도 storage 용량' },
    { t: 'Google Workspace Marketplace 앱', d: '앱 › Marketplace 앱 › 앱 목록', k: 'marketplace', w: 'marketplace 마켓 앱 설치 canva 캔바' },
    { t: '사용자 일괄 업데이트(CSV)', d: '디렉터리 › 사용자', k: 'users', w: 'csv 일괄 업로드 bulk' }
  ].filter(s => s.w.includes(q) || s.t.toLowerCase().includes(q));
  return { us, gs, sets: SET.slice(0, 3) };
}
function showTopResults() {
  const box = $('#topResults'), q = $('#topSearch').value;
  const r = topSearchResults(q);
  if (!r) { box.hidden = true; return; }
  let h = '';
  if (r.us.length) h += '<div class="tr-h">사용자</div>' + r.us.map(u => `<button class="tr-i" data-go="user" data-param="${u.id}" data-user="${u.id}">${uAv(u, 28)}<span>${esc(uName(u))}<small>${esc(u.email)} · ${esc(ouPath(u.ou))}</small></span></button>`).join('');
  if (r.gs.length) h += '<div class="tr-h">그룹</div>' + r.gs.map(g => `<button class="tr-i" data-go="groups">${ic('group')}<span>${esc(g.name)}<small>${esc(g.email)}</small></span></button>`).join('');
  if (r.sets.length) h += '<div class="tr-h">설정</div>' + r.sets.map(s => `<button class="tr-i" data-go="${s.k}">${ic('settings')}<span>${esc(s.t)}<small>${esc(s.d)}</small></span></button>`).join('');
  if (!h) h = `<div class="tr-none">「${esc(q)}」에 대한 결과가 없습니다.</div>`;
  box.innerHTML = h; box.hidden = false; topSel = -1;
}
function hideTopResults() { $('#topResults').hidden = true; $('#tsearchWrap').classList.remove('open'); }
$('#topSearch').addEventListener('input', () => { showTopResults(); sig('top-search', $('#topSearch').value); if (typeof coachCheck === 'function') coachCheck(); });
$('#topSearch').addEventListener('focus', showTopResults);
$('#topSearch').addEventListener('keydown', e => {
  const items = $$('#topResults .tr-i');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!items.length) return;
    topSel = (topSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((x, i) => x.classList.toggle('on', i === topSel));
  } else if (e.key === 'Enter') {
    const it = items[topSel >= 0 ? topSel : 0]; if (it) it.click();
  }
});

/* ============ 공통: 조직 단위 나무 ============ */
function ouCount(id) { const set = new Set(ouDesc(id)); return activeUsers().filter(u => set.has(u.ou)).length; }
/* opts {sel, check:Set, counts, q} — 실물처럼 아이콘 없이 ▾ 삼각형과 들여쓰기 */
function ouTreeHTML(opts = {}) {
  const out = [], q = (opts.q || '').trim();
  const show = id => !q || ouDesc(id).some(d => ouById(d).name.includes(q));
  (function walk(id, depth) {
    if (!show(id)) return;
    const o = ouById(id), kids = ouKids(id);
    const on = opts.check ? opts.check.has(id) : opts.sel === id;
    const pl = 12 + depth * 18;
    const tw = kids.length ? `<svg class="tw" aria-hidden="true" style="transform:rotate(90deg)"><use href="#i-tri"/></svg>` : '<span style="width:16px;flex:none"></span>';
    if (opts.check) out.push(`<li><label class="tn ${on ? 'on' : ''}" style="padding-left:${pl}px" data-ou-pick="${id}"><input type="checkbox" ${on ? 'checked' : ''} tabindex="-1">${esc(o.name)}</label></li>`);
    else out.push(`<li><button class="tn ${on ? 'on' : ''}" style="padding-left:${pl}px" data-ou-pick="${id}">${tw}<span>${esc(o.name)}</span>${opts.counts ? `<span class="cnt">${ouCount(id)}</span>` : ''}</button></li>`);
    for (const k of kids) walk(k.id, depth + 1);
  })(S.ous.find(o => !o.parent).id, 0);

function limitMB(l) { return l.value * (l.unit === 'TB' ? 1024 * 1024 : 1024); }
function effStorageLimit(u) {
  /* 사용자 > 그룹(여러 그룹이면 큰 쪽) > 조직 단위(상속) 순서로 적용 */
  const ul = S.storage.byUser && S.storage.byUser[u.id] && S.storage.byUser[u.id].limit;
  if (ul) return { mb: limitMB(ul), from: '사용자 개별 설정', lim: ul };
  const gl = S.groups.filter(g => g.members.includes(u.id) && S.storage.byGroup[g.id] && S.storage.byGroup[g.id].limit)
    .map(g => ({ mb: limitMB(S.storage.byGroup[g.id].limit), from: `그룹 '${g.name}'`, lim: S.storage.byGroup[g.id].limit }));
  if (gl.length) { gl.sort((a, b) => b.mb - a.mb); return gl[0]; }
  for (const id of ouChain(u.ou)) {
    const c = S.storage.byOu[id];
    if (c && c.limit) return { mb: limitMB(c.limit), from: `'${ouLabel(id)}'에서 상속됨`, lim: c.limit };
  }
  return null;
}

/* 실물 빈 템플릿은 한국어 콘솔에서도 영어 머리행이다(형식 보기: First name / Last name / Email address / Password / Org Unit Path) */
const CSV_HEAD = CSV_COLS.map(c => c[2]);
const COL_LABEL = Object.fromEntries(CSV_COLS.map(c => [c[0], c[2]]));
const normH = h => String(h).replace(/\[[^\]]*\]/g, '').replace(/[^0-9a-z가-힣]/gi, '').toLowerCase();
const HMAP = {};
for (const [k, ko, en] of CSV_COLS) { HMAP[normH(ko)] = k; HMAP[normH(en)] = k; }
HMAP[normH('New Licenses')] = 'license'; HMAP[normH('Org Unit Path')] = 'ou';

function csvCell(v) { v = v == null ? '' : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function csvText(rows) { return '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }
function csvRowFor(o) { return CSV_COLS.map(c => o[c[0]] == null ? '' : o[c[0]]); }
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}

/* 가명 학생 CSV */
function makeFakeCsv(n, ouPathStr, mix) {
  const ou = ouByPath(ouPathStr), g = gradeOfOu(ou.id);
  const nos = freeStudentNos(g, n);
  const taken = takenNames();
  const rows = nos.map(num => {
    const nm = fakeName(taken);
    return { first: nm.first, last: nm.last, email: `s${num}@${DOMAIN}`, password: genPw(), ou: ouPathStr, empId: num, dept: `${g}학년 ${+num.slice(1, 3)}반`, changePw: 'TRUE' };
  });
  if (mix) {
    if (rows[5]) rows[5].last = '';                                  /* 파일의 7행: 성 비움 */
    const k = Math.min(13, rows.length - 1);                          /* 파일의 15행: 없는 조직 단위 */
    if (k !== 5 && rows[k]) rows[k].ou = ouPathStr + ' 3반';
  }
  return csvText([CSV_HEAD].concat(rows.map(csvRowFor)));
}

/* CSV 검사 */
function analyzeCsv(text) {
  const res = { rows: [], counts: { add: 0, update: 0, fail: 0 }, warns: [], fatal: null, total: 0 };
  text = String(text || '').replace(/^﻿/, '');
  const bad = (text.match(/�/g) || []).length;
  if (bad > 2) { res.fatal = '한글이 깨져 보입니다. 엑셀에서 「CSV UTF-8(쉼표로 분리)」 형식으로 다시 저장해 주세요.'; return res; }
  const all = parseCSV(text).filter(r => r.some(c => String(c).trim() !== ''));
  if (!all.length) { res.fatal = '파일이 비어 있음'; return res; }
  const head = all[0].map(h => HMAP[normH(h)] || null);
  all[0].forEach((h, i) => { if (!head[i] && String(h).trim()) res.warns.push(`알 수 없는 열 '${h}'은(는) 무시됩니다`); });
  for (const k of ['first', 'last', 'email', 'password', 'ou']) if (!head.includes(k)) { res.fatal = `파일에 '${COL_LABEL[k]}' 열이 있어야 합니다`; return res; }
  const data = all.slice(1);
  res.total = data.length;
  if (!data.length) { res.fatal = '파일이 비어 있음(머리행만 있음)'; return res; }
  if (data.length > 500) { res.fatal = '연수용 실습판은 한 번에 500명까지만 올립니다(실물은 150,000명).'; return res; }
  const seen = {};
  data.forEach((cells, i) => {
    const r = { rowNo: i + 2, msgs: [] };
    head.forEach((k, j) => { if (k) r[k] = String(cells[j] == null ? '' : cells[j]).trim(); });
    const email = (r.email || '').toLowerCase(); r.email = email;
    const exists = email && userByEmail(email);
    for (const k of ['first', 'last', 'email', 'ou']) if (!r[k]) r.msgs.push(`${r.rowNo}행에 '${COL_LABEL[k]}'이(가) 비어 있음`);
    if (!r.password && !exists) r.msgs.push(`${r.rowNo}행에 '${COL_LABEL.password}'이(가) 비어 있음`);
    if (email) {
      const [lp, dom] = email.split('@');
      if (!dom || dom !== DOMAIN || !LOCAL_RE.test(lp || '')) r.msgs.push(`이메일 주소가 올바르지 않거나 ${DOMAIN} 도메인이 아닙니다`);
      else if (seen[email]) r.msgs.push(`파일 안에 같은 이메일이 두 번 있습니다(${seen[email]}행·${r.rowNo}행)`);
      else seen[email] = r.rowNo;
    }
    if (r.password && r.password !== '****' && r.password.length < 8) r.msgs.push('비밀번호는 8자 이상이어야 합니다');
    if (r.ou) { const o = ouByPath(r.ou); if (!r.ou.startsWith('/') || !o) r.msgs.push('ACTION FAILED: OU INVALID'); else r.ouId = o.id; }
    if (r.recPhone && !/^\+[1-9]\d{6,14}$/.test(r.recPhone)) r.msgs.push('복구 전화는 E.164 형식(+8210…)이어야 합니다');
    if (r.changePw && !/^(true|false)$/i.test(r.changePw)) r.msgs.push('「다음 로그인 시 비밀번호 변경」은 TRUE 또는 FALSE여야 합니다');
    if (r.newStatus && !/^(active|suspended)$/i.test(r.newStatus)) r.msgs.push('「새 상태」는 Active 또는 Suspended만 쓸 수 있습니다');
    if (exists && exists.status === 'deleted' && !r.msgs.length) r.msgs.push('최근 삭제된 사용자의 주소입니다. 먼저 복원하세요');
    r.action = r.msgs.length ? 'fail' : exists ? 'update' : 'add';
    res.counts[r.action]++;
    res.rows.push(r);
  });
  return res;
}

function applyBulk(id) {

      task.summary.update++; task.log.push({ row: r.rowNo, email: r.email, result: '업데이트', msg: '' });

}

};
ACT['mk-finish'] = () => {
  if (D.scope === 'specific' && !D.targets.length) { toast('조직 단위를 하나 이상 고르세요.'); return; }
  const a = MK_APPS_BY_ID[D.app];
  const scope = D.scope === 'all' ? { type: 'all', targets: [] } : { type: 'ou', targets: D.targets.slice() };
  let rec = S.apps.marketplace.find(x => x.id === a.id);
  if (!rec) { rec = { id: a.id, name: a.name, vendor: a.vendor, installed: true, scope, enabled: true, installedAt: now() }; S.apps.marketplace.push(rec); }
  else { rec.installed = true; rec.scope = scope; rec.enabled = true; rec.installedAt = now(); }

/* 저장용량 사용 및 설정 — 왼쪽에서 사용자/그룹/조직 단위를 고르고, 「사용자 저장용량 한도」 행을 편집 */
function stTarget() {
  const k = S.ui.storageKind || 'ou';
  if (k === 'group' && S.groups.some(g => g.id === S.ui.storageGroup)) return { kind: 'group', id: S.ui.storageGroup, name: (S.groups.find(g => g.id === S.ui.storageGroup) || {}).name };
  if (k === 'user' && userById(S.ui.storageUser)) return { kind: 'user', id: S.ui.storageUser, name: uName(userById(S.ui.storageUser)) };
  const id = ouById(S.ui.storageOu) ? S.ui.storageOu : 'ou_root';
  return { kind: 'ou', id, name: ouLabel(id) };
}
function stMap(kind) { if (kind === 'user') return S.storage.byUser || (S.storage.byUser = {}); return kind === 'group' ? S.storage.byGroup : S.storage.byOu; }
function stLimit(t) { const r = stMap(t.kind)[t.id]; return r && r.limit || null; }
function stInherited(t) {
  if (t.kind !== 'ou') return null;
  for (const id of ouChain(t.id).slice(1)) { const l = S.storage.byOu[id] && S.storage.byOu[id].limit; if (l) return { l, from: id }; }
  return null;
}
function freshSD() {
  const t = stTarget(), l = stLimit(t);
  return { kind: t.kind, id: t.id, editing: false, mode: l ? 'on' : 'off', value: l ? String(l.value) : '', unit: l ? l.unit : 'GB', err: '' };
}
PICK.storage = (id, el, kind) => {
  if (SD && SD.editing) toast('저장하지 않은 변경사항은 버렸습니다.');
  S.ui.storageKind = kind;
  if (kind === 'group') S.ui.storageGroup = id; else if (kind === 'user') S.ui.storageUser = id; else S.ui.storageOu = id;

};

function storageUsersPreview(ouId) {

    ${list.map(u => { const l = effStorageLimit(u); return `<tr><td style="padding-left:20px"><a href="#/user/${u.id}" data-go="user" data-param="${u.id}" style="color:#1f1f1f">${esc(uName(u))}</a></td><td>${esc(ouLabel(u.ou))}</td><td class="num">${fmtGB(u.storageUsedMB)}</td><td class="num">${l ? l.lim.value + ' ' + l.lim.unit : '<span class="muted">없음</span>'}</td></tr>`; }).join('')}

ONBIND.SD = (key, el) => {

ACT['storage-edit'] = () => { SD.editing = true; rerenderMain(); sig('storage-edit'); };
ACT['storage-cancel'] = () => { SD = freshSD(); rerenderMain(); };
ACT['save-storage'] = () => {
  sig('save-storage-try');
  const t = stTarget(); let lim = null;
  if (SD.mode === 'on') {
    const v = Number(SD.value);
    if (!SD.value || !Number.isFinite(v) || v < 1 || Math.floor(v) !== v) { SD.err = '1 이상의 정수를 입력하세요.'; rerenderMain(); return; }
    if (SD.unit === 'TB' && v > 100) { SD.err = '학교 전체 저장용량(100 TB)보다 클 수 없습니다.'; rerenderMain(); return; }
    lim = { value: v, unit: SD.unit };
  }
  const map = stMap(t.kind);
  if (lim) map[t.id] = { limit: lim }; else delete map[t.id];
  const name = (t.kind === 'group' ? '그룹 ' : t.kind === 'user' ? '사용자 ' : '') + (t.kind === 'ou' ? ouPath(t.id) : t.name);
  audit('storage_limit', name, lim ? `${lim.value} ${lim.unit}` : '사용 중지/상속');
  save(); SD = freshSD(); rerenderMain();
  toast('저장용량 한도가 저장되었습니다. 대부분의 변경사항은 몇 분 안에 적용됩니다.');
  sig('storage-saved', name);
};

function curMainMission() { return MAIN_MISSIONS.find(m => !S.mission.done[m.id]) || null; }
function missionUnlocked(m) {
  if (S.mission.done[m.id]) return true;

/* 결과만 보고 완료 처리(순서 지킴: 열린 미션만) */
function checkMissions() {
  for (const m of MISSIONS) {
    if (S.mission.done[m.id] || !missionUnlocked(m)) continue;
    if (GD && GD.id === m.id && !GD.replay) continue;   /* 따라하기 중이면 코치가 끝맺는다 */
    if (m.check()) { S.mission.done[m.id] = now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} missionDoneNotice(m); }
  }
}

let _coachBusy = false;
function coachCheck() {

        const ns = m.steps[GD.i];

/* ============ 자동 검사(개발용) ============ */
/* AdminSim.runMission('m1') — 코치가 짚는 곳을 DOM 클릭만으로 따라가 미션을 완주한다. */
let NO_DL = false;
const _download = download;
download = function (name, text, type) { if (NO_DL) return; _download(name, text, type); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const tick = () => Promise.resolve();
async function runMission(id) {
  const t0 = performance.now(), log = [];
  coachStart(id);
  if (!GD) return { id, ok: false, err: '시작 못 함(잠김 또는 선행 조건)' };
  const m = MISSIONS.find(x => x.id === id);
  let lastI = -1, same = 0;
  for (let guard = 0; guard < 400 && GD && GD.id === id; guard++) {
    const st = m.steps[GD.i];
    const tgt = coachTarget(st);
    if (!tgt) { if (++same > 60) { log.push('목표 없음 ' + (GD.i + 1) + ' ' + st.t); break; } await sleep(120); coachCheck(); continue; }
    const a = st.auto || {};
    if (a.type != null && /^(INPUT|TEXTAREA)$/.test(tgt.tagName)) {
      tgt.focus(); tgt.value = a.type; tgt.dispatchEvent(new Event('input', { bubbles: true }));
      if (a.then) { await tick(); const t2 = $(a.then); if (t2) t2.click(); }
    } else if (a.select != null && tgt.tagName === 'SELECT') {
      tgt.value = a.select; tgt.dispatchEvent(new Event('change', { bubbles: true }));
    } else tgt.click();
    await tick(); await tick();
    coachCheck();
    const cur = GD ? GD.i : -1;
    if (cur === lastI) { if (++same > 60) { log.push('멈춤 ' + (cur + 1) + ' ' + st.t); break; } await sleep(120); }
    else { same = 0; lastI = cur; log.push((cur + 1) + ''); }
  }
  if (GD && GD.id === id) coachStop();
  const ok = !!S.mission.done[id];
  if (D && D.type === 'mDone') closeDlg();
  return { id, ok, ms: Math.round(performance.now() - t0), log: log.join(' ') };
}
/* 안내서 캡처용: 따라하기를 한 단계씩 진행 */
async function coachStepOnce() {
  if (!GD) return { active: false };
  const m = MISSIONS.find(x => x.id === GD.id), st = m.steps[GD.i], before = GD.i;
  const tgt = coachTarget(st);
  if (tgt) {
    const a = st.auto || {};
    if (a.type != null && /^(INPUT|TEXTAREA)$/.test(tgt.tagName)) { tgt.focus(); tgt.value = a.type; tgt.dispatchEvent(new Event('input', { bubbles: true })); if (a.then) { await tick(); const t2 = $(a.then); if (t2) t2.click(); } }
    else if (a.select != null && tgt.tagName === 'SELECT') { tgt.value = a.select; tgt.dispatchEvent(new Event('change', { bubbles: true })); }
    else tgt.click();
  }
  for (let k = 0; k < 40; k++) { await tick(); coachCheck(); if (!GD || GD.i !== before) break; await sleep(100); }
  return { active: !!GD, before, after: GD ? GD.i : -1 };
}
function coachInfo() { if (!GD) return { active: false }; const m = MISSIONS.find(x => x.id === GD.id), st = m.steps[GD.i]; coachPaint(); return { active: true, id: GD.id, i: GD.i, n: m.steps.length, t: st.t }; }
async function runAll(ids = ['m1', 'm2', 'm3', 'm4', 'm5', 'm6', 'm7', 'm8', 'm9', 'm10', 'b1', 'b2', 'b3']) {
  NO_DL = true; window.__res = [];
  for (const id of ids) { const r = await runMission(id); window.__res.push(r); await sleep(50); }
  NO_DL = false;
